[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "get-physics-done-test"
version = "0.1.0"
description = "GPD-compatible simulation research infrastructure for data-driven multiscale field dynamics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.24.1",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
sim = [
    "torch>=2.11.0",
    "neuraloperator>=2.0.0",
]
graph = [
    "networkx>=3.6.1",
    "torch-geometric>=2.7.0",
]
equivariant = [
    "e3nn>=0.6.0",
]

[project.scripts]
gpd-test = "src.gpd_test.cli:main"
gpd-test-recover = "src.scripts.check_env:recover_main"
sentinel = "src.sentinel_core.cli.app:main"
sentinel-sim = "src.sentinel_core.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
    "types-PyYAML>=6.0.12.20260408",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "smoke: fast CLI and end-to-end sanity checks",
    "regression: seeded regression and metric envelope checks",
    "physics: invariant and conservation-oriented validation checks",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
