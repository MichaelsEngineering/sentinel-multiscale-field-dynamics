name: ci

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sync dependencies
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy src tests
      - name: Test
        run: uv run pytest -q
      - name: CLI smoke
        run: uv run sentinel smoke grid --config configs/tasks/turbulence2d_baseline.yaml

  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native preset
        run: cmake --preset native-debug
      - name: Build native preset
        run: cmake --build --preset native-debug
      - name: Test native preset
        run: ctest --preset native-debug
