name: ci

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Sync dependencies
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy src tests
      - name: Test
        run: uv run pytest -q
      - name: CLI smoke
        run: uv run sentinel smoke grid --config configs/tasks/turbulence2d_baseline.yaml

  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Configure native preset
        run: cmake --preset native-debug
      - name: Build native preset
        run: cmake --build --preset native-debug
      - name: Test native preset
        run: ctest --preset native-debug
