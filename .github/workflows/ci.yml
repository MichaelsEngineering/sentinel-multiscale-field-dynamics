name: ci

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Sync dependencies
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy src tests
      - name: Test
        run: uv run pytest -q
      - name: CLI smoke
        run: uv run sentinel smoke grid --config configs/tasks/turbulence2d_baseline.yaml

  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure native preset
        run: cmake --preset native-debug
      - name: Build native preset
        run: cmake --build --preset native-debug
      - name: Test native preset
        run: ctest --preset native-debug
