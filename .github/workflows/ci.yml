name: ci

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Sync dependencies
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy src tests
      - name: Test
        run: uv run pytest -q
      - name: CLI smoke
        run: uv run sentinel smoke grid --config configs/tasks/turbulence2d_baseline.yaml

  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Configure native preset
        run: cmake --preset native-debug
      - name: Build native preset
        run: cmake --build --preset native-debug
      - name: Test native preset
        run: ctest --preset native-debug
